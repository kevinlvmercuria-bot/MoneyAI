<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>NailMate AI · 会员经营工作台</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div id="app">
            <div class="shell">
                <aside class="sidebar" id="sidebar">
                    <button class="brand" data-view="dashboard">
                        <span class="brand-symbol">N</span
                        ><span class="brand-name"
                            >NailMate<span class="brand-sub"
                                >会员经营助手</span
                            ></span
                        >
                    </button>
                    <nav class="nav" aria-label="工作空间"></nav>
                    <div class="sidebottom">
                        <div class="side-note">
                            <strong>让每次关怀，恰好发生。</strong>
                            <p id="data-origin">正在连接数据库…</p>
                            <span data-member-count>加载中</span> 位虚拟会员
                        </div>
                        <div class="owner">
                            <span class="avatar">店</span
                            ><span
                                >店主工作空间<small
                                    >记录保存至 SQL Server</small
                                ></span
                            >
                        </div>
                    </div>
                </aside>
                <main class="main" id="main" tabindex="-1">
                    <div class="topbar">
                        <span
                            >NailMate /
                            <span id="page-title">经营驾驶舱</span></span
                        >
                        <div class="top-actions">
                            <span class="base-date">演示基准日 2026-11-07</span
                            ><span class="sim">SIMULATION</span
                            ><button class="text-btn" data-action="reset">
                                重置演示
                            </button>
                        </div>
                    </div>
                    <section id="content" aria-label="页面内容">
                        <div class="loading">
                            <h1>NailMate</h1>
                            <p>正在读取数据库中的会员资料…</p>
                        </div>
                    </section>
                    <p class="footer">
                        会员与经营结果为模拟数据 · AI 文案由店主核对后自行发送 ·
                        记录与图片保存至数据库
                    </p>
                    <details>
                        <summary>操作记录</summary>
                        <ol id="logs"></ol>
                    </details>
                </main>
            </div>
        </div>
        <div id="overlay"></div>
        <div id="toaster" aria-live="polite"></div>
        <script src="rules.js" defer></script>
        <script src="workspace.js" defer></script>
    </body>
</html>
